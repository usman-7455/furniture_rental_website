<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Furniture Rental</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .input-icon.error {
      border-color: red;
    }
    
    .error-message {
      color: red;
      font-size: 0.8rem;
      margin-top: 5px;
      display: block;
    }

    .success-message {
      color: green;
      font-size: 0.9rem;
      margin-top: 15px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body class="auth-body">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">Furniture Rental</a>
      <ul class="nav-links">
        <li><a href="index.html#featured">Categories</a></li>
        <li><a href="index.html#how-it-works">How It Works</a></li>
        <li><a href="index.html#why-choose-us">Why Choose Us</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Forgot Password Form Section -->
  <section class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Forgot Password</h2>
        <p>Enter your email to reset your password</p>
      </div>

      <form class="auth-form" id="forgotPasswordForm">
        <div class="form-group">
          <div class="input-icon" id="emailContainer">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Email Address">
          </div>
          <span id="emailError" class="error-message"></span>
        </div>

        <button type="submit" class="auth-button">Reset Password</button>
        <div id="successMessage" class="success-message">
          Password reset link has been sent to your email address.
        </div>
      </form>

      <div class="auth-footer">
        <p>Remember your password? <a href="login.html">Login</a></p>
      </div>
    </div>
  </section>


</body>
</html>
