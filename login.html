<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Furniture Rental</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .input-icon.error {
      border-color: red;
    }
    
    .error-message {
      color: red;
      font-size: 0.8rem;
      margin-top: 5px;
      display: block;
    }
  </style>
</head>
<body class="auth-body">
  <!-- Navbar -->
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">Furniture Rental</a>
      <ul class="nav-links">
        <li><a href="index.html#featured">Categories</a></li>
        <li><a href="index.html#how-it-works">How It Works</a></li>
        <li><a href="index.html#why-choose-us">Why Choose Us</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
      <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </nav>

  <!-- Login Form Section -->
  <section class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Login to access your furniture rental account</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <div class="input-icon" id="emailContainer">
            <i class="fas fa-envelope"></i>
            <input type="email" id="email" placeholder="Email Address">
          </div>
          <span id="emailError" class="error-message"></span>
        </div>

        <div class="form-group">
          <div class="input-icon" id="passwordContainer">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="Password">
          </div>
          <span id="passwordError" class="error-message"></span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="forget_password.html" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="auth-button">Login</button>
      </form>

      <div class="social-login">
        <p>Or login with</p>
        <div class="social-icons">
          <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
          <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
        </div>
      </div>

      <div class="auth-footer">
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </div>
  </section>

<script src="login_validation.js"></script>
</body>
</html>
